<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recover Account | Novaa Speed</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/public/style/styles.css">
    <link rel="shortcut icon" href="/public/images/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="/public/style/forget.css">
    <style>
        .nav-links a[href='/dashboard'] {
            text-decoration: none;
            color: white;
            font-weight: 700;
            transition: 0.3s ease;
            font-size: 200px;
            position: relative;
            padding: 5px 0;
            font-size: 1.2rem;
        }

        .nav-links a[href="/dashboard"]::before {
            display: none;
        }

        #nav-profile a:hover {
            text-shadow: 0 0 10px var(--accent-cyan);
        }

        #nav-profile a,
        #mobile-profile a {
            color: var(--accent-cyan);
        }

        .nav-links a[href="/dashboard"]:hover {
            transform: translateY(-99px) scale(990);
            /* box-shadow: 0 0 25px rgba(0, 255, 242, 0.6); */
            text-shadow: none;
        }
    </style>
</head>

<body>

    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>

    <div class="grid-bg"></div>
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>

    <nav class="navbar">
        <div class="nav-container">
            <button class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <a href="/" id="under" class="nav-brand">
                <div class="logo">NOVAA SPEED<span class="dot"></span> </div>
            </a>
            <ul class="nav-links">
                <li><a href="/#home">Home</a></li>
                <li><a href="/#about">About</a></li>
                <li><a href="/#community">Community</a></li>
                <li><a href="/announcements">Announcements</a></li>
                <li><a href="/#join">Join Us</a></li>

                <li id="nav-signup"><a href="/signup">Sign up</a></li>
                <li id="nav-profile" style="display: none;">
                    <a href="/dashboard"><i class="fas fa-user-circle"></i> Profile</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="mobile-nav-overlay" id="mobileNavOverlay"></div>
    <div class="mobile-nav" id="mobileNav">
        <div class="mobile-nav-header">
            <h3>Menu</h3>
            <button class="close-nav" id="closeNav">&times;</button>
        </div>
        <ul class="mobile-nav-links">
            <li><a href="/#home" style="--i:1;">Home</a></li>
            <li><a href="/#about" style="--i:2;">About</a></li>
            <li><a href="/#community" style="--i:3;">Community</a></li>
            <li><a href="/announcements">Announcements</a></li>
            <li><a href="/#join" style="--i:4;">Join Us</a></li>

            <li id="mobile-signup"><a href="/signup" style="--i:5;">Sign up</a></li>
            <li id="mobile-profile" style="display: none;"><a href="/profile" style="--i:5;">Profile</a></li>
        </ul>
    </div>

    <div class="auth-card">
        <div class="auth-header">
            <h2>Account Recovery</h2>
            <p>Access the mainframe securely.</p>
        </div>

        <div id="statusMsg" class="status-message"></div>

        <form id="forgetForm">
            <div class="input-group">
                <label>Registered Email</label>
                <input type="email" id="emailInput" placeholder="name@example.com" required>
                <i class="fas fa-envelope"></i>
            </div>

            <button type="button" id="sendOtpBtn" class="cta-button primary">
                Send Verification Code <i class="fas fa-paper-plane"></i>
            </button>

            <div id="step-otp">
                <div class="divider"></div>

                <div class="input-group">
                    <label>Secure OTP</label>
                    <input type="text" id="otpInput" placeholder="••••••" maxlength="6"
                        style="letter-spacing: 4px; font-weight: bold;">
                    <i class="fas fa-shield-alt"></i>
                </div>

                <div class="input-group">
                    <label>New Password</label>
                    <input type="password" id="newPassInput" placeholder="New credential">
                    <i class="fas fa-lock"></i>
                </div>

                <div class="input-group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirmPassInput" placeholder="Confirm credential">
                    <i class="fas fa-lock"></i>
                </div>

                <button type="submit" class="cta-button primary" id="resetBtn">Update Credentials</button>
            </div>
        </form>

        <div style="text-align: center;">
            <a href="/login" class="back-link"><i class="fas fa-arrow-left"></i> Return to Login</a>
        </div>
    </div>

    <script src="/public/javascript/forget.js"></script>

</body>

</html>
