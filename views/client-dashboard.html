<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Dashboard | Novaa Speed</title>
    <link rel="stylesheet" href="/public/style/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/public/style/client.css">
    <link rel="stylesheet" href="/public/style/profile.css">
    <link rel="shortcut icon" href="/public/images/logo.png" type="image/x-icon">

    <style>
        /* Force Modal Visibility */
        #switchModal {
            display: none;
            /* Hidden by default */
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9) !important;
            z-index: 2147483647 !important;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
            opacity: 1 !important;
            visibility: visible !important;
        }

        #switchModal[style*="display: flex"] {
            display: flex !important;
        }

        .modal-box {
            background: #111;
            padding: 40px;
            border-radius: 12px;
            border: 2px solid var(--accent-cyan);
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 0 50px rgba(0, 255, 242, 0.4);
            position: relative;
            z-index: 2147483648 !important;
        }

        .modal-actions {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
        }

        .btn-confirm {
            background: var(--accent-cyan);
            color: #000;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-weight: 800;
            cursor: pointer;
            font-size: 1rem;
        }

        .btn-cancel {
            background: transparent;
            color: #fff;
            border: 1px solid #555;
            padding: 12px 30px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
        }

        /* Action Buttons Container in Header */
        .dashboard-actions {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        /* Identical Switch Button Style */
        .switch-btn-action {
            background: linear-gradient(45deg, #7b2cbf, #3a0ca3);
            /* Purple Gradient */
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .switch-btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(123, 44, 191, 0.4);
        }

        .logout-btn-action {
            background: transparent;
            border: 1px solid #ff3333;
            color: #ff3333;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .logout-btn-action:hover {
            background: rgba(255, 51, 51, 0.1);
        }
    </style>
</head>

<body>
    <div class="grid-bg"></div>
    <div class="glow-orb glow-orb-1"></div>

    <nav class="navbar">
        <div class="nav-container">
            <a href="/" id="under" class="nav-brand">
                <div class="logo">NOVAA SPEED<span class="dot"></span> </div>
            </a>
            <ul class="nav-links">
                <li><a href="/#home">Home</a></li>
                <li><a href="/#about">About</a></li>
                <li><a href="/#community">Community</a></li>
            </ul>
        </div>
    </nav>

    <div class="dashboard-container fade-in">
        <div class="welcome-banner">
            <h1 style="font-size: 2.5rem;">Hello, <span id="clientName" class="text-gradient">Client</span></h1>
            <p style="color: #ccc;">Track your active projects and request new services.</p>

            <div class="dashboard-actions">
                <button onclick="openSwitchModal()" class="switch-btn-action"><i class="fas fa-random"></i> Switch to
                    Talent</button>
                <a href="/auth/logout" class="logout-btn-action"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </div>

        <div class="grid-layout">
            <div id="projectsContainer">
                <h2 style="margin-bottom: 1.5rem;">Your Projects</h2>
                <div id="loading" style="text-align:center; color:#888;">Loading projects...</div>
            </div>

            <div class="request-box">
                <h3 style="margin-bottom: 1.5rem;">Start New Project</h3>
                <form id="projectForm">
                    <input type="text" id="pTitle" class="req-input" placeholder="Project Title (e.g. E-commerce Site)"
                        required>
                    <textarea id="pDesc" class="req-input" rows="4" placeholder="Brief description of requirements..."
                        required></textarea>
                    <button type="submit" class="cta-button primary" style="width: 100%;">Submit Request</button>
                </form>
            </div>
        </div>
    </div>

    <div id="switchModal">
        <div class="modal-box">
            <h2 style="color: var(--accent-cyan); margin-bottom: 15px;">Switch Profile</h2>
            <p style="color: #ddd; margin-bottom: 25px; line-height: 1.5;">
                You are about to switch to your <strong>Talent</strong> profile.<br>
                Do you want to continue?
            </p>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeSwitchModal()">Cancel</button>
                <button class="btn-confirm" onclick="confirmSwitch()">Continue</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', loadDashboard);

        async function loadDashboard() {
            try {
                const res = await fetch('/api/client/dashboard');
                if (res.redirected) {
                    window.location.href = res.url;
                    return;
                }

                const data = await res.json();

                document.getElementById('clientName').textContent = data.user.username;
                const container = document.getElementById('projectsContainer');

                if (data.projects.length === 0) {
                    container.innerHTML = `<div style="padding:20px; text-align:center; color:#666; border:1px dashed #444; border-radius:10px;">No active projects. Start one now!</div>`;
                    return;
                }

                let html = '<h2 style="margin-bottom: 1.5rem;">Your Projects</h2>';
                data.projects.forEach(p => {
                    html += `
                    <div class="project-card">
                        <div class="project-header">
                            <h3>${p.title}</h3>
                            <span class="status-badge status-${p.status}">${p.status}</span>
                        </div>
                        <p style="color:#aaa; font-size:0.9rem; margin-bottom:1rem;">${p.description}</p>
                        
                        <div style="display:flex; justify-content:space-between; font-size:0.8rem; color:#888;">
                            <span>Progress</span>
                            <span>${p.progress}%</span>
                        </div>
                        <div class="progress-bar"><div class="progress-fill" style="width:${p.progress}%"></div></div>
                        
                        <div class="team-info">
                            <div class="team-avatar"><i class="fas fa-user-astronaut"></i></div>
                            <span>Assigned to: <strong style="color:#fff">${p.assignedTeam || 'Pending...'}</strong></span>
                        </div>
                    </div>`;
                });
                container.innerHTML = html;
            } catch (err) {
                console.error(err);
            }
        }

        document.getElementById('projectForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('pTitle').value;
            const desc = document.getElementById('pDesc').value;

            const res = await fetch('/api/client/project', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, description: desc })
            });

            if (res.ok) {
                alert('Project requested successfully!');
                loadDashboard();
                e.target.reset();
            }
        });

        // --- SWITCH MODAL LOGIC ---
        window.openSwitchModal = function () {
            const modal = document.getElementById('switchModal');
            if (modal) {
                document.body.appendChild(modal);
                modal.style.display = 'flex';
            }
        };

        window.closeSwitchModal = function () {
            document.getElementById('switchModal').style.display = 'none';
        };

        window.confirmSwitch = async function () {
            try {
                const res = await fetch('/api/user/switch-role', { method: 'POST' });
                const data = await res.json();
                if (data.success) {
                    window.location.href = '/dashboard';
                } else {
                    alert("Error switching profile");
                }
            } catch (e) {
                console.error(e);
                alert("Connection failed");
            }
        };
    </script>
</body>

</html>
