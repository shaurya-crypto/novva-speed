<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novaa Admin | Command Center</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/public/style/styles.css">
    <link rel="stylesheet" href="/public/style/admin.css">
    <link rel="shortcut icon" href="/public/images/logo.png" type="image/x-icon">
    <style>
        .simple-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .simple-modal-content {
            background: #111;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid var(--accent-cyan);
            width: 90%;
            max-width: 400px;
            position: relative;
            box-shadow: 0 0 20px rgba(0, 255, 242, 0.2);
            text-align: left;
        }

        .close-simple-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .menu-btn {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #333;
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 1rem;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu-btn:hover {
            background: rgba(0, 255, 242, 0.1);
            border-color: var(--accent-cyan);
        }
    </style>
</head>

<body>
    <div class="admin-header">
        <div class="admin-title">NOVAA SPEED | ADMIN</div>
        <div><button class="refresh-btn" onclick="init()">Refresh</button><button class="refresh-btn" onclick="logout()"
                style="margin-left: 10px;">Logout</button></div>
    </div>
    <div class="tabs"><button class="tab-btn active" onclick="switchTab('apps')">Application</button><button class="tab-btn"
            onclick="switchTab('users')">Users</button><button class="tab-btn"
            onclick="switchTab('projects')">Projects</button></div>

    <div id="apps-section" class="section active">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Status</th>
                        <th>Name</th>
                        <th>Contact</th>
                        <th>Role</th>
                        <th>Exp</th>
                        <th>Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
    <div id="users-section" class="section">
        <div class="table-container">
            <table>
                <tbody id="usersBody"></tbody>
            </table>
        </div>
    </div>
    <div id="projects-section" class="section">
        <div class="table-container">
            <table>
                <tbody id="projectsBody"></tbody>
            </table>
        </div>
    </div>

    <div id="actionMenuModal" class="simple-modal-overlay">
        <div class="simple-modal-content">
            <button class="close-simple-modal" onclick="closeModal('actionMenuModal')">&times;</button>
            <h3 style="margin-bottom: 1.5rem; color: var(--accent-cyan);">Select Action</h3>
            <input type="hidden" id="menuAppId">
            <button class="menu-btn" onclick="openAssignIdModal()"><i class="fas fa-id-card"></i> Assign ID
                Card</button>
            <button class="menu-btn" onclick="openMessageModal()"><i class="fas fa-envelope"></i> Send Message to
                User</button>
            <button class="menu-btn" onclick="openWorkModal()"><i class="fas fa-tasks"></i> Assign Work</button>
        </div>
    </div>

    <div id="simpleIdModal" class="simple-modal-overlay">
        <div class="simple-modal-content">
            <button class="close-simple-modal" onclick="closeModal('simpleIdModal')">&times;</button>
            <h3 style="margin-bottom: 1.5rem; color: var(--accent-cyan);">ID Card Details</h3>
            <input type="text" id="simpleRole" class="project-input" placeholder="Role...">
            <input type="text" id="simpleTeam" class="project-input" placeholder="Team/Department...">
            <input type="text" id="simpleLeader" class="project-input" placeholder="Leader Name...">
            <input type="text" id="simplePost" class="project-input" placeholder="Post...">
            <button class="cta-button primary" onclick="submitIdCard()" style="margin-top: 20px; width: 100%;">Save ID
                Details</button>
        </div>
    </div>

    <div id="messageModal" class="simple-modal-overlay">
        <div class="simple-modal-content">
            <button class="close-simple-modal" onclick="closeModal('messageModal')">&times;</button>
            <h3 style="margin-bottom: 1.5rem; color: orange;">Send Message</h3>
            <p style="font-size: 0.8rem; color: #888; margin-bottom: 10px;">This will appear on the user's profile
                dashboard.</p>
            <textarea id="adminMsgInput" class="project-input" rows="4" placeholder="Type message..."></textarea>
            <button class="cta-button primary" onclick="submitAdminMessage()"
                style="margin-top: 20px; width: 100%; background: orange; border:none; color: black;">Send
                Message</button>
        </div>
    </div>

    <div id="workModal" class="simple-modal-overlay">
        <div class="simple-modal-content">
            <button class="close-simple-modal" onclick="closeModal('workModal')">&times;</button>
            <h3 style="margin-bottom: 1.5rem; color: #00ff00;">Assign Work</h3>
            <p style="font-size: 0.8rem; color: #888; margin-bottom: 10px;">This will appear in the user's sidebar.</p>
            <textarea id="workInput" class="project-input" rows="6" placeholder="Describe tasks..."></textarea>
            <button class="cta-button primary" onclick="submitWork()"
                style="margin-top: 20px; width: 100%; background: #00ff00; border:none; color: black;">Assign
                Work</button>
        </div>
    </div>

    <div id="projectModal" class="modal-overlay">
        <div class="modal-content"><button class="close-modal" onclick="closeModal('projectModal')">&times;</button>
            <h3>Update Project</h3><input type="hidden" id="editProjectId"><input type="text" id="teamInput"
                class="project-input">
            <div class="status-btn-group"><button class="status-option"
                    onclick="setProjectStatus('completed')">Done</button></div><button class="cta-button primary"
                onclick="saveProjectChanges()">Save</button>
        </div>
    </div>

    <div id="rejectModal" class="simple-modal-overlay">
        <div class="simple-modal-content" style="border-color: #ff3333;"><button class="close-simple-modal"
                onclick="closeModal('rejectModal')">&times;</button>
            <h3 style="color: #ff3333;">Reject</h3><input type="hidden" id="rejectAppId"><label
                class="radio-option"><input type="radio" name="rejectAction" value="rejected" checked>
                Reject</label><label class="radio-option"><input type="radio" name="rejectAction" value="blocked">
                Block</label><button class="cta-button primary" onclick="submitRejectAction()"
                style="background: #ff3333;">Confirm</button>
        </div>
    </div>

    <script src="/public/javascript/admin.js"></script>
</body>

</html>
