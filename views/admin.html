<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novaa Admin | Command Center</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/public/style/styles.css">
    <link rel="stylesheet" href="/public/style/admin.css">
    <link rel="shortcut icon" href="/public/images/logo.png" type="image/x-icon">

    <style>
        /* Force Modal styles to ensure visibility */
        .simple-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 10000;
            /* Super high z-index */
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .simple-modal-content {
            background: #111;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid var(--accent-cyan);
            width: 90%;
            max-width: 500px;
            position: relative;
            box-shadow: 0 0 20px rgba(0, 255, 242, 0.2);
        }

        .close-simple-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="admin-header">
        <div class="admin-title">NOVAA SPEED | ADMIN PANEL</div>
        <div>
            <button class="refresh-btn" onclick="init()"><i class="fas fa-sync-alt"></i> Refresh</button>
            <button class="refresh-btn" onclick="logout()" style="background: #333; margin-left: 10px;">Logout</button>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('apps')">Applications</button>
        <button class="tab-btn" onclick="switchTab('users')">Registered Users</button>
        <button class="tab-btn" onclick="switchTab('projects')">Projects</button>
    </div>

    <div id="apps-section" class="section active">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Status</th>
                        <th>Name</th>
                        <th>Contact</th>
                        <th>Role</th>
                        <th>Exp</th>
                        <th>Submitted</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <div id="users-section" class="section">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Admin</th>
                        <th>Joined Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="usersBody"></tbody>
            </table>
        </div>
    </div>

    <div id="projects-section" class="section">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Status</th>
                        <th>Project Title</th>
                        <th>Client Email</th>
                        <th>Team Assigned</th>
                        <th>Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="projectsBody"></tbody>
            </table>
        </div>
    </div>

    <div id="projectModal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal('projectModal')">&times;</button>
            <h3 style="margin-bottom: 1.5rem; color: var(--accent-cyan);">Update Project</h3>
            <input type="hidden" id="editProjectId">

            <label style="color: #888; font-size: 0.9rem;">Assign Team</label>
            <input type="text" id="teamInput" class="project-input" placeholder="e.g. Dev Team Alpha">

            <label style="color: #888; font-size: 0.9rem; margin-top: 10px; display: block;">Update Status</label>
            <div class="status-btn-group">
                <button class="status-option" onclick="setProjectStatus('pending')">Pending</button>
                <button class="status-option" onclick="setProjectStatus('processing')">Processing</button>
                <button class="status-option" onclick="setProjectStatus('near_completion')">Near Complete</button>
                <button class="status-option" onclick="setProjectStatus('completed')">Completed</button>
            </div>
            <button class="cta-button primary" onclick="saveProjectChanges()"
                style="margin-top: 20px; width: 100%;">Save Changes</button>
        </div>
    </div>

    <div id="simpleIdModal" class="simple-modal-overlay">
        <div class="simple-modal-content">
            <button class="close-simple-modal" onclick="closeSimpleModal()">&times;</button>
            <h3 style="margin-bottom: 1.5rem; color: var(--accent-cyan);">Assign ID Card Details</h3>
            <input type="hidden" id="simpleAppId">

            <label style="color: #888; font-size: 0.9rem;">Official Role (e.g. Developer)</label>
            <input type="text" id="simpleRole" class="project-input" placeholder="Role...">

            <label style="color: #888; font-size: 0.9rem; margin-top: 10px; display: block;">Team Name/Department</label>
            <input type="text" id="simpleTeam" class="project-input" placeholder="Team/Department...">

            <label style="color: #888; font-size: 0.9rem; margin-top: 10px; display: block;">Leader Name/Head</label>
            <input type="text" id="simpleLeader" class="project-input" placeholder="Leader Name...">

            <label style="color: #888; font-size: 0.9rem; margin-top: 10px; display: block;">Post/Designation</label>
            <input type="text" id="simplePost" class="project-input" placeholder="Post...">

            <label style="color: #888; font-size: 0.9rem; margin-top: 10px; display: block;">Important
                Update/Message</label>
            <input type="text" id="simpleMsg" class="project-input" placeholder="Message for user...">

            <label style="color: #888; font-size: 0.9rem; margin-top: 10px; display: block;">Assigned Work</label>
            <textarea id="simpleWork" class="project-input" rows="3" placeholder="Work description..."></textarea>

            <button class="cta-button primary" onclick="submitSimpleCard()"
                style="margin-top: 20px; width: 100%;">Update ID Card</button>
        </div>
    </div>

    <script src="/public/javascript/admin.js"></script>
</body>

</html>
