<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novaa Admin | Command Center</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/public/style/styles.css">
    <meta name="google-site-verification" content="eaHGDUb5S7unwSryJklmGzRcjV4CeerTeTmn1bIt7go" />
    <link rel="stylesheet" href="/public/style/admin.css">
    <link rel="shortcut icon" href="/public/images/logo.png" type="image/x-icon">
</head>

<body>

    <div class="admin-header">
        <div class="admin-title">NOVA SPEED | ADMIN PANEL</div>
        <button class="refresh-btn" onclick="init()"><i class="fas fa-sync-alt"></i> Refresh Data</button>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('apps')">Applications</button>
        <button class="tab-btn" onclick="switchTab('users')">Registered Users</button>
    </div>

    <div id="apps-section" class="section active">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Status</th>
                        <th>Name</th>
                        <th>Contact</th>
                        <th>Role</th>
                        <th>Exp</th>
                        <th>Submitted</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <div id="users-section" class="section">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Admin Access</th>
                        <th>Joined Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="usersBody"></tbody>
            </table>
        </div>
    </div>

    <script src="/public/javascript/admin.js"></script>
</body>

</html>
