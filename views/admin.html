<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novaa Admin | Command Center</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/public/style/styles.css">
    <style>
        body {
            background-color: #050505;
            color: #fff;
            padding: 20px;
            display: block;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 20px;
        }

        .admin-title {
            font-size: 1.5rem;
            color: var(--accent-cyan);
            font-weight: 700;
        }

        .refresh-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .refresh-btn:hover {
            background: var(--accent-cyan);
            color: #000;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #888;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            font-weight: 600;
            transition: 0.3s;
        }

        .tab-btn.active {
            background: var(--accent-cyan);
            color: #000;
            border-color: var(--accent-cyan);
        }

        .tab-btn:hover:not(.active) {
            border-color: #fff;
            color: #fff;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .table-container {
            overflow-x: auto;
            background: rgba(20, 20, 20, 0.5);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        th,
        td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        th {
            background: rgba(0, 210, 255, 0.05);
            color: var(--accent-cyan);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .status-badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-pending {
            background: rgba(255, 165, 0, 0.15);
            color: orange;
        }

        .status-checked {
            background: rgba(0, 255, 127, 0.15);
            color: #00ff7f;
        }

        .action-btn {
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 5px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
        }

        .check-btn {
            background: rgba(0, 255, 127, 0.1);
            color: #00ff7f;
        }

        .check-btn:hover {
            background: #00ff7f;
            color: #000;
        }

        .delete-btn {
            background: rgba(255, 50, 50, 0.1);
            color: #ff3333;
        }

        .delete-btn:hover {
            background: #ff3333;
            color: #fff;
        }

        tr.row-checked {
            opacity: 0.6;
        }
    </style>
</head>

<body>

    <div class="admin-header">
        <div class="admin-title">NOVA SPEED | ADMIN PANEL</div>
        <button class="refresh-btn" onclick="init()"><i class="fas fa-sync-alt"></i> Refresh Data</button>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('apps')">Applications</button>
        <button class="tab-btn" onclick="switchTab('users')">Registered Users</button>
    </div>

    <div id="apps-section" class="section active">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Status</th>
                        <th>Name</th>
                        <th>Contact</th>
                        <th>Role</th>
                        <th>Exp</th>
                        <th>Submitted</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <div id="users-section" class="section">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Admin Access</th>
                        <th>Joined Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="usersBody"></tbody>
            </table>
        </div>
    </div>

    <script src="/public/javascript/admin.js"></script>
</body>

</html>
