<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Novaa Speed</title>
    <link rel="stylesheet" href="/public/style/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="shortcut icon" href="/public/images/logo.png" type="image/x-icon">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .navbar {
            position: absolute;
            top: 0;
            width: 100%;
        }

        .auth-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin-top: 80px;
            margin-bottom: 40px;
        }

        .auth-card {
            background: rgba(10, 10, 10, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 2.5rem;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: translateY(30px);
            animation: cardEntrance 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        .auth-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), var(--accent-purple), transparent);
            animation: borderFlow 3s linear infinite;
        }

        @keyframes cardEntrance {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes borderFlow {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(100%);
            }
        }


        .google-btn-link {
            text-decoration: none;
            display: block;
            margin-top: 15px;
        }

        .google-btn {
            background: white;
            color: black;
            border: none;
            width: 100%;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            transition: 0.3s;
            padding: 12px;
        }

        .google-btn:hover {
            background: #eee;
            transform: translateY(-2px);
        }

        .input-group {
            position: relative;
            margin-bottom: 1.2rem;
        }

        .input-group label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
            display: block;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px 12px 40px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .input-group i {
            position: absolute;
            left: 12px;
            top: 40px;
            color: var(--text-secondary);
            transition: 0.3s;
        }

        .input-group input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(0, 255, 242, 0.15);
            outline: none;
            transform: translateY(-2px);
        }

        .input-group input:focus+i {
            color: var(--accent-cyan);
        }

        .role-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 1.5rem;
        }

        .role-option {
            flex: 1;
            position: relative;
        }

        .role-option input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }

        .role-option .box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .role-option input:checked+.box {
            background: rgba(0, 255, 242, 0.1);
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 255, 242, 0.15);
        }

        .role-option:hover .box {
            background: rgba(255, 255, 255, 0.08);
        }

        .btn-group {
            margin-top: 2rem;
        }

        .cta-button {
            width: 100%;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            transition: 0.3s;
        }

        .google-btn-link {
            text-decoration: none;
            display: block;
            margin-top: 15px;
        }

        .google-btn {
            background: white;
            color: black;
            border: none;
        }

        .google-btn:hover {
            background: #eee;
            transform: translateY(-2px);
        }

        .auth-footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .auth-footer a {
            color: var(--accent-cyan);
            text-decoration: none;
            font-weight: 600;
        }

        .error-msg {
            color: #ff3333;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 1rem;
            min-height: 1.2em;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(255, 51, 51, 0.3);
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            20%,
            60% {
                transform: translateX(-5px);
            }

            40%,
            80% {
                transform: translateX(5px);
            }
        }

        .shake {
            animation: shake 0.4s ease-in-out;
            border-color: #ff3333 !important;
        }

        .nav-links a[href="/login"] {
            background: linear-gradient(90deg, var(--accent-purple), var(--accent-cyan));
            color: #000 !important;
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: 700;
            box-shadow: 0 0 10px rgba(0, 255, 242, 0.3);
            border: none;
        }

        .nav-links a[href="/login"]:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 0 20px rgba(0, 255, 242, 0.5);
        }

        .nav-links a[href="/login"]::before {
            display: none;
        }
    </style>
    <link rel="shortcut icon" href="/public/images/logo.png" type="image/x-icon">
</head>

<body>
    <div class="grid-bg"></div>
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>

    <nav class="navbar">
        <div class="nav-container">
            <button class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <a href="/" id="under" class="nav-brand">
                <div class="logo">NOVAA SPEED<span class="dot"></span> </div>
            </a>
            <ul class="nav-links">
                <li><a href="/#home">Home</a></li>
                <li><a href="/#about">About</a></li>
                <li><a href="/#community">Community</a></li>
                <li><a href="/#join">Join Us</a></li>
                <li><a href="/login">Login</a></li>
            </ul>
        </div>
    </nav>

    <div class="mobile-nav-overlay" id="mobileNavOverlay"></div>
    <div class="mobile-nav" id="mobileNav">
        <div class="mobile-nav-header">
            <h3>Menu</h3>
            <button class="close-nav" id="closeNav">&times;</button>
        </div>
        <ul class="mobile-nav-links">
            <li><a href="/#home" style="--i:1;">Home</a></li>
            <li><a href="/#about" style="--i:2;">About</a></li>
            <li><a href="/#community" style="--i:3;">Community</a></li>
            <li><a href="/#join" style="--i:4;">Join Us</a></li>
            <li><a href="/login" style="--i:5;">Login</a></li>
        </ul>
    </div>

    <div class="auth-container">
        <div class="auth-card">
            <h2 class="form-title" style="text-align: center;">Initialize <span class="text-gradient">Protocol</span>
            </h2>
            <p class="form-subtitle" style="text-align: center; margin-bottom: 2rem; color: #aaa;">Create your Novaa
                Identity</p>

            <div id="errorMsg" class="error-msg"></div>

            <form id="signupForm">
                <div class="role-selector">
                    <label class="role-option">
                        <input type="radio" name="role" value="talent" checked>
                        <span class="box">
                            <i class="fas fa-code"></i> Work with us
                        </span>
                    </label>
                    <label class="role-option">
                        <input type="radio" name="role" value="client">
                        <span class="box">
                            <i class="fas fa-briefcase"></i> Client
                        </span>
                    </label>
                </div>

                <div class="input-group">
                    <label>Username</label>
                    <input type="text" name="username" placeholder="Neo_Anderson" required>
                    <i class="fas fa-user"></i>
                </div>

                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" name="email" placeholder="cyber@example.com" required>
                    <i class="fas fa-envelope"></i>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="••••••••" required minlength="6">
                    <i class="fas fa-lock"></i>
                </div>

                <div class="btn-group">
                    <button type="submit" class="cta-button primary">
                        Create Account <span class="arrow">→</span>
                    </button>
                </div>
            </form>

            <h3 style="text-align: center; margin-top: 25px;"> OR</h3>

            <a href="/auth/google?role=talent" id="googleBtn" class="google-btn-link">
                <button type="button" class="cta-button google-btn">
                    <i class="fab fa-google"></i> Continue with Google
                </button>
            </a>

            <div class="auth-footer">
                Already in the system? <a href="/login">Login here</a>
            </div>
        </div>
    </div>

    <script src="/public/javascript/signup.js"></script>
</body>

</html>
