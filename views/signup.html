<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Novaa Speed</title>
    <link rel="stylesheet" href="/public/style/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/public/style/signup.css">
    <style>
        .nav-links a[href="/login"] {
            background: linear-gradient(90deg, var(--accent-purple), var(--accent-cyan));
            color: #000 !important;
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: 700;
            letter-spacing: 0.5px;
            box-shadow: 0 0 10px rgba(0, 255, 242, 0.3);
            transition: all 0.3s ease;
            border: none;
        }
        .nav-links a[href="/login"]:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 0 25px rgba(0, 255, 242, 0.6);
            text-shadow: none;
        }

        .nav-links a[href="/login"]::before {
            display: none;
        }
    </style>
</head>

<body>
    <div class="grid-bg"></div>
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>

    <nav class="navbar">
        <div class="nav-container">
            <button class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <a href="/" id="under" class="nav-brand">
                <div class="logo">NOVAA SPEED<span class="dot"></span> </div>
            </a>
            <ul class="nav-links">
                <li><a href="/#home">Home</a></li>
                <li><a href="/#about">About</a></li>
                <li><a href="/#community">Community</a></li>
                <li><a href="/#join">Join Us</a></li>
                <li><a href="/login">Login</a></li>
            </ul>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <h2 class="form-title" style="text-align: center;">Initialize <span class="text-gradient">Protocol</span>
            </h2>
            <p class="form-subtitle" style="text-align: center; margin-bottom: 1.5rem; color: #aaa;">Create your Novaa
                Identity</p>

            <div id="errorMsg" class="error-msg"></div>

            <form id="signupForm">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" name="username" placeholder="Neo_Anderson" required>
                    <i class="fas fa-user"></i>
                </div>
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" name="email" placeholder="cyber@example.com" required>
                    <i class="fas fa-envelope"></i>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="••••••••" required minlength="6">
                    <i class="fas fa-lock"></i>
                </div>
                <div class="btn-group" style="justify-content: center; margin-top: 2rem;">
                    <button type="submit" class="cta-button primary" style="width: 100%; border-radius: 12px;">
                        Create Account <span class="arrow">→</span>
                    </button>
                </div>
            </form>
            <div class="auth-footer">Already in the system? <a href="/login">Login here</a></div>
        </div>
    </div>
    <script src="/public/javascript/signup.js"></script>
</body>

</html>
